[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-factory"
version = "0.1.0"
description = "Reproducible, role-scoped skills for Python Copilot SDK workers"
requires-python = ">=3.11"
dependencies = [
  "github-copilot-sdk==1.0.31",
  "httpx>=0.28,<1",
  "azure-identity>=1.25,<2",
  "aiohttp>=3.13,<4",
  "pyyaml>=6,<7",
]

[project.scripts]
ai-factory = "ai_factory.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
